<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand" aria-label="BarkBrowse">
            <span class="login-brand-mark" aria-hidden="true">B</span>
            BarkBrowse
        </div>
        <div class="login-heading">
            <p class="eyebrow">Your next chapter</p>
            <h1 id="login-title">Welcome back</h1>
            <p>Sign in to find your new best friend.</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-field">
                <label for="name">Name</label>
                <input class="form-control" type="text" id="name" [(ngModel)]="name" name="name"
                    autocomplete="name" required>
            </div>
            <div class="form-field">
                <label for="email">Email address</label>
                <input class="form-control" type="email" id="email" [(ngModel)]="email" name="email"
                    autocomplete="email" required>
            </div>
            <button class="btn btn-primary login-btn" [disabled]="!name.trim() || !email.trim() || loadingStatus"
                type="submit">
                <span *ngIf="!loadingStatus">Continue</span>
                <span *ngIf="loadingStatus" class="spinner-border spinner-border-sm" role="status">
                    <span class="visually-hidden">Signing in…</span>
                </span>
            </button>
            <div *ngIf="error" class="alert alert-danger mt-3 mb-0" role="alert">{{ error }}</div>
        </form>

        <p class="login-note">BarkBrowse is a demo project for exploring shelter dogs. It is not an official adoption service.</p>
    </section>
</main>
