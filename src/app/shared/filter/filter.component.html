<div class="modal fade filter-settings-modal" id="filterSettingsModal" tabindex="-1"
    aria-labelledby="filterSettingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered filter-settings-dialog">
        <div class="modal-content filter-settings-content">
            <div class="modal-header filter-settings-header">
                <div class="filter-settings-heading">
                    <p class="filter-settings-eyebrow">Search preferences</p>
                    <h1 class="modal-title filter-settings-title" id="filterSettingsModalLabel">Filter your search</h1>
                    <p class="filter-settings-intro">Narrow the results to find your best match.</p>
                </div>
                <button type="button" class="btn-close filter-settings-close" data-bs-dismiss="modal"
                    aria-label="Close filter settings"></button>
            </div>
            <div class="modal-body filter-settings-body">
                <section class="filter-section" aria-labelledby="breedFilterLabel">
                    <div class="filter-section-heading">
                        <label for="filterByBreed" id="breedFilterLabel" class="filter-field-label">Breed</label>
                        <p id="breedFilterHelp" class="filter-field-help">Select one or more. Leave empty to include all breeds.</p>
                    </div>
                    <select *ngIf="breeds.length" id="filterByBreed" multiple class="form-select filter-breed-select"
                        [(ngModel)]="selectedBreeds" name="breeds" aria-describedby="breedFilterHelp">
                        <option *ngFor="let breed of breeds" [value]="breed">{{ breed }}</option>
                    </select>
                </section>

                <section class="filter-section" aria-labelledby="ageFilterHeading">
                    <h2 id="ageFilterHeading" class="filter-section-title">Age range</h2>
                    <div class="filter-field-grid" [ngClass]="{'filter-range-invalid': ageMin > ageMax}">
                        <div class="filter-field">
                            <label for="ageMin" class="filter-field-label">Minimum age</label>
                            <input type="number" [max]="ageMax" id="ageMin" [(ngModel)]="ageMin" name="ageMin"
                                class="form-control" min="0" placeholder="Any age">
                        </div>
                        <div class="filter-field">
                            <label for="ageMax" class="filter-field-label">Maximum age</label>
                            <input type="number" [min]="ageMin" id="ageMax" [(ngModel)]="ageMax" name="ageMax"
                                class="form-control" min="0" placeholder="Any age">
                        </div>
                    </div>
                    <p *ngIf="ageMin > ageMax" class="filter-validation" role="alert">
                        Minimum age must be less than or equal to maximum age.
                    </p>
                </section>

                <section class="filter-section" aria-labelledby="sortFilterHeading">
                    <h2 id="sortFilterHeading" class="filter-section-title">Sort results</h2>
                    <div class="filter-field-grid">
                        <div class="filter-field">
                            <label for="sortField" class="filter-field-label">Sort by</label>
                            <select id="sortField" class="form-select" [(ngModel)]="sortField" name="sortField">
                                <option value="name">Name</option>
                                <option value="breed">Breed</option>
                                <option value="age">Age</option>
                            </select>
                        </div>
                        <div class="filter-field">
                            <label for="sortOrder" class="filter-field-label">Order</label>
                            <select id="sortOrder" class="form-select" [(ngModel)]="sortOrder" name="sortOrder">
                                <option value="asc">Ascending</option>
                                <option value="desc">Descending</option>
                            </select>
                        </div>
                    </div>
                </section>
            </div>
            <div class="modal-footer filter-settings-footer">
                <button type="button" class="btn btn-light filter-cancel-button" (click)="cancel()">Cancel</button>
                <button type="button" class="btn btn-primary filter-save-button" [disabled]="ageMin > ageMax"
                    (click)="save()">Apply filters</button>
            </div>
        </div>
    </div>
</div>
