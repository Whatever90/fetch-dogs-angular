<div class="dog-list" [class.favorites-mode]="favoritesMode" aria-live="polite">
    <ng-container *ngIf="!loadingStatus">
        <article class="dog-card fade-in" *ngFor="let dog of dogs" (mouseenter)="hoverDog(dog)">
            <button type="button" class="dog-photo-button" (click)="selectDog(dog)"
                [attr.aria-label]="'View details for ' + dog.name">
                <img dogImageFallback class="dog-photo" [src]="dog.img || 'dog-placeholder.png'"
                    [alt]="dog.name || 'Dog available for adoption'"
                    loading="lazy">
                <span class="photo-badge" *ngIf="dog.age !== undefined">{{ dog.age }} {{ dog.age === 1 ? 'year' : 'years' }} old</span>
            </button>
            <div class="dog-details">
                <div class="dog-title-row">
                    <h3 class="dog-name">{{ dog.name }}</h3>
                    <span class="dog-age" *ngIf="dog.age !== undefined">{{ dog.age }}y</span>
                </div>
                <p class="dog-breed" *ngIf="dog.breed as breed">
                    <span class="dog-breed-trigger" tabindex="0"
                        [attr.aria-describedby]="'breed-description-' + dog.id">
                        {{ breed }}
                        <span class="dog-breed-tooltip" role="tooltip" [id]="'breed-description-' + dog.id">
                            {{ getBreedDescription(breed) }}
                        </span>
                    </span>
                </p>
                <p class="dog-location" *ngIf="dog.location">
                    <span aria-hidden="true">⌖</span>
                    {{ dog.location.city }}, {{ dog.location.state }}
                </p>
                <p class="dog-location" *ngIf="!dog.location && dog.zip_code">
                    <span aria-hidden="true">⌖</span>
                    {{ dog.zip_code }}
                </p>
                <button type="button" class="favorite-toggle"
                    [class.is-favorite]="favorites.includes(dog.id)"
                    [class.is-remove-action]="favoritesMode && favorites.includes(dog.id)"
                    [attr.aria-pressed]="favorites.includes(dog.id)"
                    [attr.aria-label]="favoritesMode ? 'Remove ' + dog.name + ' from saved dogs' : favorites.includes(dog.id) ? 'Remove ' + dog.name + ' from saved dogs' : 'Save ' + dog.name"
                    (click)="toggleFavorite(dog.id)">
                    <span aria-hidden="true">{{ favoritesMode ? '×' : favorites.includes(dog.id) ? '♥' : '♡' }}</span>
                    {{ favoritesMode ? 'Remove' : favorites.includes(dog.id) ? 'Saved' : 'Save dog' }}
                </button>
            </div>
        </article>
        <div class="empty-state" *ngIf="!favoritesMode && !dogs.length">
            <span class="empty-icon" aria-hidden="true">⌖</span>
            <h3>No dogs in this area yet</h3>
            <p>Try moving the map or adjusting your filters to see more dogs.</p>
        </div>
    </ng-container>

    <div class="loading-state" *ngIf="loadingStatus" role="status" aria-label="Loading dogs">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Finding dogs for you…</span>
    </div>
</div>
